openapi: 3.1.0
info:
  title: AIIP Main Backend — AI callback API
  version: 1.0.0-proposed
  description: Private AI→Main authenticated callbacks, durable persistence before 202
servers:
- url: http://main-backend.apps.svc.cluster.local
  description: illustrative service DNS; resolve from deployment, not fixed literal
security:
- ServiceAuth: []
tags:
- name: Auth
- name: Users
- name: Projects
- name: Environments
- name: Services
- name: Deployments
- name: Incidents
- name: Investigations
- name: AI output
- name: Dashboard
- name: Telemetry
- name: Integrations
- name: Settings
- name: Ingestion
- name: Internal callbacks
paths:
  /internal/v1/ai/events:
    post:
      tags:
      - Internal callbacks
      summary: AI → Main Backend single event callback
      operationId: post_internal_v1_ai_events
      responses:
        '202':
          description: Accepted/created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackAck'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationEvent'
      security:
      - ServiceAuth: []
      description: Event is persisted/deduplicated by event_id and (investigation_id, sequence); must be authorized
        for incident scope
  /internal/v1/ai/results:
    post:
      tags:
      - Internal callbacks
      summary: AI → Main Backend final structured result
      operationId: post_internal_v1_ai_results
      responses:
        '202':
          description: Accepted/created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackAck'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIResultCallback'
      security:
      - ServiceAuth: []
      description: Atomic persist report/hypotheses/evidence/status, idempotent by event_id and investigation_id
  /internal/v1/ai/incidents/{incident_id}/context:
    get:
      tags:
      - Internal callbacks
      summary: AI backend reads scoped sanitized incident context
      operationId: get_ai_incident_context
      security:
      - ServiceAuth: []
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Sanitized incident context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentContext'
components:
  schemas:
    UUID:
      type: string
      format: uuid
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
      additionalProperties: false
    Problem:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
      description: Единый JSON error envelope для public/internal API; details sanitized
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
      additionalProperties: false
    AuthUser:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
    AuthSession:
      type: object
      additionalProperties: false
      required:
      - user
      - account_created
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        account_created:
          type: boolean
          description: True when this verification created the account (first sign-in).
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
        created_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - name
      - slug
      - created_at
      additionalProperties: false
    ProjectWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
      required:
      - name
      - slug
      additionalProperties: false
    Environment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        is_production:
          type: boolean
      required:
      - id
      - project_id
      - name
      - slug
      - is_production
      additionalProperties: false
    EnvironmentWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 1
          maxLength: 80
        is_production:
          type: boolean
      required:
      - name
      - slug
      additionalProperties: false
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        name:
          type: string
        external_names:
          type: array
          items:
            type: string
        description:
          type: string
        repository_url:
          type:
          - string
          - 'null'
        health_url:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
      required:
      - id
      - project_id
      - environment_id
      - name
      - external_names
      - created_at
      additionalProperties: false
    ServiceWrite:
      type: object
      properties:
        environment_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        external_names:
          type: array
          items:
            type: string
        description:
          type: string
        repository_url:
          type:
          - string
          - 'null'
        health_url:
          type:
          - string
          - 'null'
      required:
      - environment_id
      - name
      additionalProperties: false
    Deployment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        version:
          type: string
        commit_sha:
          type:
          - string
          - 'null'
        deployed_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        status:
          type: string
          enum:
          - started
          - succeeded
          - failed
          - rolled_back
        source:
          type: string
        source_url:
          type:
          - string
          - 'null'
      required:
      - id
      - project_id
      - environment_id
      - service_id
      - version
      - deployed_at
      - status
      - source
      additionalProperties: false
    Incident:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        project_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        service_ids:
          type: array
          items:
            type: string
            format: uuid
        severity:
          type: string
          enum:
          - critical
          - high
          - medium
          - low
        status:
          type: string
          enum:
          - open
          - investigating
          - awaiting_review
          - resolved
        source:
          type: string
        detected_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        created_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        updated_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
        latest_investigation_id:
          type:
          - string
          - 'null'
          format: uuid
        alert_fingerprint:
          type:
          - string
          - 'null'
      required:
      - id
      - title
      - project_id
      - environment_id
      - service_ids
      - severity
      - status
      - source
      - detected_at
      - created_at
      - updated_at
      additionalProperties: false
    IncidentCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
        project_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        service_ids:
          type: array
          items:
            type: string
            format: uuid
        severity:
          type: string
          enum:
          - critical
          - high
          - medium
          - low
        detected_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        source:
          type: string
      required:
      - title
      - project_id
      - environment_id
      - service_ids
      - severity
      - detected_at
      additionalProperties: false
    IncidentStatusChange:
      type: object
      properties:
        status:
          type: string
          enum:
          - open
          - resolved
        comment:
          type: string
      required:
      - status
      additionalProperties: false
      description: Automated investigation statuses are server-owned; user actions may reopen/resolve with permissions
    ExecutionBudget:
      type: object
      properties:
        max_steps:
          type: integer
          minimum: 1
          maximum: 20
        max_tool_calls:
          type: integer
          minimum: 1
          maximum: 40
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 1200
      required:
      - max_steps
      - max_tool_calls
      - timeout_seconds
      additionalProperties: false
    Investigation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - inconclusive
          - failed
          - timed_out
          - canceled
        created_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        attempt:
          type: integer
          minimum: 1
        parent_investigation_id:
          type:
          - string
          - 'null'
          format: uuid
        current_step:
          type: integer
          minimum: 0
        tool_calls_count:
          type: integer
          minimum: 0
        budget:
          $ref: '#/components/schemas/ExecutionBudget'
        failure_code:
          type:
          - string
          - 'null'
        failure_message:
          type:
          - string
          - 'null'
        cancel_requested:
          type: boolean
          default: false
          description: Transient request flag, not Investigation.status
      required:
      - id
      - incident_id
      - project_id
      - environment_id
      - status
      - created_at
      - attempt
      - current_step
      - tool_calls_count
      - budget
      - cancel_requested
      additionalProperties: false
    InvestigationCreate:
      type: object
      properties:
        context_note:
          type:
          - string
          - 'null'
          maxLength: 2000
      required: []
      additionalProperties: false
      description: MVP normally starts without arbitrary user prompt; context_note optional internal/manual note
        not forwarded as tool instruction
    SourceLink:
      type: object
      properties:
        source_type:
          type: string
          enum:
          - loki
          - prometheus
          - tempo
          - github
          - kubernetes
          - deployment
          - healthcheck
          - manual
          - docs_rag
          - incident_memory
        source_id:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
          format: uri
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type:
            - string
            - number
            - boolean
            - 'null'
      required:
      - source_type
      additionalProperties: false
    Evidence:
      type: object
      properties:
        id:
          type: string
          format: uuid
        investigation_id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/SourceLink'
        title:
          type: string
        summary:
          type: string
        excerpt:
          type:
          - string
          - 'null'
        service_ids:
          type: array
          items:
            type: string
            format: uuid
        hypothesis_ids:
          type: array
          items:
            type: string
            format: uuid
        collected_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        confidence_note:
          type:
          - string
          - 'null'
      required:
      - id
      - investigation_id
      - source
      - title
      - summary
      - service_ids
      - hypothesis_ids
      - collected_at
      additionalProperties: false
      description: Excerpt is sanitized and bounded, raw telemetry stays in its source
    Hypothesis:
      type: object
      properties:
        id:
          type: string
          format: uuid
        investigation_id:
          type: string
          format: uuid
        title:
          type: string
        explanation:
          type: string
        status:
          type: string
          enum:
          - pending
          - supported
          - rejected
        confidence:
          type: string
          enum:
          - high
          - medium
          - low
        evidence_ids:
          type: array
          items:
            type: string
            format: uuid
        updated_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
      required:
      - id
      - investigation_id
      - title
      - explanation
      - status
      - confidence
      - evidence_ids
      - updated_at
      additionalProperties: false
    TimelineEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
        investigation_id:
          type:
          - string
          - 'null'
          format: uuid
        occurred_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        event_type:
          type: string
        title:
          type: string
        description:
          type: string
        service_ids:
          type: array
          items:
            type: string
            format: uuid
        source:
          $ref: '#/components/schemas/SourceLink'
        causality:
          type: string
          enum:
          - observed
          - correlated
          - supported_cause
          - unknown
      required:
      - id
      - incident_id
      - occurred_at
      - event_type
      - title
      - description
      - service_ids
      - source
      - causality
      additionalProperties: false
    RCAReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
        investigation_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum:
          - completed
          - inconclusive
        summary:
          type: string
        symptoms:
          type: array
          items:
            type: string
        root_cause:
          type:
          - string
          - 'null'
        root_cause_service_ids:
          type: array
          items:
            type: string
            format: uuid
        causal_chain:
          type: array
          items:
            type: string
        hypothesis_ids:
          type: array
          items:
            type: string
            format: uuid
        evidence_ids:
          type: array
          items:
            type: string
            format: uuid
        timeline_entry_ids:
          type: array
          items:
            type: string
            format: uuid
        confidence:
          type: string
          enum:
          - high
          - medium
          - low
        remediation:
          type: array
          items:
            type: string
        prevention:
          type: array
          items:
            type: string
        limitations:
          type: array
          items:
            type: string
        generated_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
      required:
      - id
      - incident_id
      - investigation_id
      - outcome
      - summary
      - symptoms
      - root_cause
      - root_cause_service_ids
      - causal_chain
      - hypothesis_ids
      - evidence_ids
      - timeline_entry_ids
      - confidence
      - remediation
      - prevention
      - limitations
      - generated_at
      additionalProperties: false
    ReviewCreate:
      type: object
      properties:
        investigation_id:
          type: string
          format: uuid
        decision:
          type: string
          enum:
          - confirmed
          - rejected
          - corrected
        corrected_root_cause:
          type:
          - string
          - 'null'
        comment:
          type: string
          minLength: 1
          maxLength: 4000
      required:
      - investigation_id
      - decision
      - comment
      additionalProperties: false
      allOf:
      - if:
          properties:
            decision:
              const: corrected
          required:
          - decision
        then:
          required:
          - corrected_root_cause
          properties:
            corrected_root_cause:
              type: string
              minLength: 1
              maxLength: 4000
    Review:
      type: object
      properties:
        id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
        investigation_id:
          type: string
          format: uuid
        reviewer_id:
          type: string
          format: uuid
        decision:
          type: string
          enum:
          - confirmed
          - rejected
          - corrected
        corrected_root_cause:
          type:
          - string
          - 'null'
        comment:
          type: string
        created_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
      required:
      - id
      - incident_id
      - investigation_id
      - reviewer_id
      - decision
      - comment
      - created_at
      additionalProperties: false
    ToolCall:
      type: object
      properties:
        id:
          type: string
          format: uuid
        investigation_id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum:
          - started
          - completed
          - failed
          - timed_out
        started_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        duration_ms:
          type:
          - integer
          - 'null'
          minimum: 0
        input_summary:
          type: string
        output_summary:
          type:
          - string
          - 'null'
        error_code:
          type:
          - string
          - 'null'
      required:
      - id
      - investigation_id
      - name
      - status
      - started_at
      - input_summary
      additionalProperties: false
    InvestigationEvent:
      type: object
      properties:
        schema_version:
          type: string
          enum:
          - '1.0'
        event_id:
          type: string
          format: uuid
        investigation_id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        type:
          type: string
          enum:
          - investigation.pending
          - investigation.started
          - investigation.progress
          - tool.started
          - tool.completed
          - tool.failed
          - hypothesis.updated
          - evidence.added
          - investigation.completed
          - investigation.inconclusive
          - investigation.failed
          - investigation.timed_out
          - investigation.canceled
        occurred_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        data:
          type: object
          additionalProperties: true
      required:
      - schema_version
      - event_id
      - investigation_id
      - incident_id
      - sequence
      - type
      - occurred_at
      - data
      additionalProperties: false
      description: Canonical event envelope. The detailed discriminated payloads are in schemas/ai-events.schema.json
    StartAIRequest:
      type: object
      properties:
        schema_version:
          type: string
          enum:
          - '1.0'
        investigation_id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        service_ids:
          type: array
          items:
            type: string
            format: uuid
        detected_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        window:
          type: object
          properties:
            from:
              type: string
              format: date-time
              description: UTC, RFC3339 timestamp
            to:
              type: string
              format: date-time
              description: UTC, RFC3339 timestamp
          required:
          - from
          - to
          additionalProperties: false
        alert_summary:
          type: string
        budget:
          $ref: '#/components/schemas/ExecutionBudget'
        attempt:
          type: integer
          minimum: 1
        parent_investigation_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - schema_version
      - investigation_id
      - incident_id
      - project_id
      - environment_id
      - service_ids
      - detected_at
      - window
      - alert_summary
      - budget
      - attempt
      - parent_investigation_id
      additionalProperties: false
      description: Callback destination is fixed by AI service configuration (MAIN_BACKEND_INTERNAL_URL), NOT request
        payload
    StartAIAck:
      type: object
      properties:
        investigation_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - running
        accepted_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
      required:
      - investigation_id
      - status
      - accepted_at
      additionalProperties: false
    AIResultCallback:
      type: object
      properties:
        schema_version:
          type: string
          enum:
          - '1.0'
        event_id:
          type: string
          format: uuid
        investigation_id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - completed
          - inconclusive
          - failed
          - timed_out
          - canceled
        finished_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        report:
          oneOf:
          - $ref: '#/components/schemas/RCAReport'
          - type: 'null'
        hypotheses:
          type: array
          items:
            $ref: '#/components/schemas/Hypothesis'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        error:
          type:
          - string
          - 'null'
      required:
      - schema_version
      - event_id
      - investigation_id
      - incident_id
      - status
      - finished_at
      - report
      - hypotheses
      - evidence
      - timeline
      additionalProperties: false
      description: Final result delivered at least once, dedup by event_id; full report only completed/inconclusive
      allOf:
      - if:
          properties:
