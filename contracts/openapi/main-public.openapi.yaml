    LoginChallenge:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - delivery_status
      - masked_email
      - expires_in
      - resend_after
      properties:
        challenge_id:
          type: string
          pattern: ^ch_[A-Za-z0-9_-]{20,120}$
          description: Opaque high-entropy one-time login challenge identifier; not a JWT.
        delivery_status:
          type: string
          enum:
          - queued
          description: Email delivery accepted for asynchronous processing; not proof of delivery.
        masked_email:
          type: string
          maxLength: 254
          description: Partially masked email the code was sent to; the same for registered and new emails.
        expires_in:
          type: integer
          minimum: 1
          maximum: 300
          description: Seconds until the currently issued OTP expires.
        resend_after:
          type: integer
          minimum: 0
          maximum: 3600
          description: Minimum seconds until resend is allowed.
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - code
      properties:
        challenge_id:
          type: string
          pattern: ^ch_[A-Za-z0-9_-]{20,120}$
          description: Opaque high-entropy one-time login challenge identifier; not a JWT.
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: Six decimal digits. Leading zeros are significant; never parse as integer.
    OtpResendRequest:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      properties:
        challenge_id:
          type: string
          pattern: ^ch_[A-Za-z0-9_-]{20,120}$
          description: Opaque high-entropy one-time login challenge identifier; not a JWT.
    OtpResendResponse:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - delivery_status
      - expires_in
      - resend_after
      properties:
        challenge_id:
          type: string
          pattern: ^ch_[A-Za-z0-9_-]{20,120}$
          description: Opaque high-entropy one-time login challenge identifier; not a JWT.
        delivery_status:
          type: string
          enum:
          - queued
        expires_in:
          type: integer
          minimum: 1
          maximum: 300
        resend_after:
          type: integer
          minimum: 0
          maximum: 3600
    OtpProblemCode:
      type: string
      enum:
      - otp_invalid
      - otp_expired
      - otp_rate_limited
      - otp_delivery_unavailable
      - otp_challenge_invalid
      - origin_forbidden
      - unauthenticated
      - validation_error
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Short-lived RS256 JWT set by /auth/otp/verify and /auth/refresh as an HttpOnly, SameSite=Strict
        cookie on Path=/. The browser never reads or sends tokens itself (credentials include). Every state-changing
        cookie-authenticated request must carry an allowlisted Origin header, otherwise 403 origin_forbidden.
    IngestKey:
      type: apiKey
      in: header
      name: X-Ingest-Key
      description: Project API token. Issued and revoked inside a project by members with api_token.manage; bound to
        the project (and optionally environment), shown once, stored only as a hash.
    ServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: service JWT or opaque token
  parameters: {}
