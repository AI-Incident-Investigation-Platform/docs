openapi: 3.1.0
info:
  title: AI Incident Investigator — Main Backend Public API
  version: 1.0.0-proposed
  description: Implementation baseline v3 (PROPOSED pending team approval). Public REST only. No AI callbacks exposed
    on public spec. Passwordless email OTP, cookie-only session, permissions inside a project.
servers:
- url: /
  description: same-origin public API behind Traefik
security:
- CookieAuth: []
tags:
- name: Auth
- name: Users
- name: Projects
- name: Members
- name: Invitations
- name: Environments
- name: Services
- name: Deployments
- name: Incidents
- name: Investigations
- name: AI output
- name: Dashboard
- name: Telemetry
- name: Integrations
- name: Settings
- name: Ingestion
- name: Internal callbacks
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: Start registration of a new email and send a one-time code (NO session)
      operationId: post_api_v1_auth_register
      description: The account is created only by a successful /auth/otp/verify of this challenge, so unconfirmed
        accounts do not exist. Cookies are never set here.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '202':
          description: Code delivery queued; no session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginChallenge'
        '409':
          description: Email is already registered (auth.email_taken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid email (request.invalid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many codes requested for this email or client (auth.otp_rate_limited)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '503':
          description: Code delivery path unavailable (email.unavailable); nothing was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Start sign-in of a registered email and send a one-time code (NO session)
      operationId: post_api_v1_auth_login
      description: Sign-in only; registration is /auth/register. There are no passwords. An unknown email gets 404
        auth.email_not_registered. Cookies are never set here.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '202':
          description: Code delivery queued; no session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginChallenge'
        '403':
          description: Origin not allowed (security.origin_forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Email is not registered (auth.email_not_registered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid email (request.invalid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many codes requested for this email or client (auth.otp_rate_limited)
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Code delivery path unavailable (email.unavailable); nothing was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/otp/verify:
    post:
      tags:
      - Auth
      operationId: verifyEmailOtp
      summary: Verify the one-time code of sign-in or registration and open a session
      description: The only endpoint that opens a session. Verification is atomic and one-time, bound to the
        challenge from /auth/login or /auth/register. A registration code creates the account here
        (account_created=true) and publishes user.registered; the users service then creates the profile.
        Tokens are never returned in the body; both are set as HttpOnly cookies.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Session opened
          headers:
            Set-Cookie:
              description: 'access_token: HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=900 and refresh_token:
                HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=2592000'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: Wrong code (auth.otp_invalid); details.attempts_left is the number of attempts left
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Origin not allowed (security.origin_forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Code expired, already used or attempts exhausted (auth.otp_expired, auth.challenge_invalid); start
            again with /auth/login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The email was registered meanwhile (auth.email_taken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Registration event not confirmed by the broker (events.unavailable); no account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/otp/resend:
    post:
      tags:
      - Auth
      operationId: resendEmailOtp
      summary: Send a new code for an existing challenge
      description: The previous code becomes invalid. Not more often than resend_after and not more than 3 times per
        challenge; the challenge lives at most 900 seconds.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
      responses:
        '202':
          description: Replacement code queued; previous code revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpResendResponse'
        '410':
          description: Challenge no longer valid (auth.challenge_invalid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Resend too early or resend limit reached (auth.otp_rate_limited)
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Rotate the session cookies
      operationId: post_api_v1_auth_refresh
      description: Reads the refresh_token cookie, rotates it and issues a new access_token cookie. No body in either
        direction. A code is not required again for an already verified session.
      security: []
      responses:
        '204':
          description: Cookies rotated
          headers:
            Set-Cookie:
              description: New access_token and refresh_token cookies, same attributes as in /auth/otp/verify
              schema:
                type: string
        '401':
          description: Refresh cookie missing, expired, revoked or reused (auth.invalid_refresh_token, auth.refresh_token_reused)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Origin not allowed (security.origin_forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke the current session
      operationId: post_api_v1_auth_logout
      description: Revokes the session of the refresh_token cookie and clears both cookies. Idempotent.
      security: []
      responses:
        '204':
          description: Session revoked, cookies cleared
        '403':
          description: Origin not allowed (security.origin_forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Current user identity
      operationId: get_api_v1_auth_me
      description: Identity only. Projects and the caller's permissions in them come from the projects API.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          description: Not authenticated (security.not_authenticated, auth.account_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/email/change:
    post:
      tags:
      - Auth
      summary: 'Start email change: codes go to the current and the new email'
      operationId: post_api_v1_auth_email_change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
      responses:
        '202':
          description: Both codes queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeChallenge'
        '401':
          description: No session (security.not_authenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: New email is already registered (auth.email_taken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: New email equals the current one (auth.email_unchanged) or invalid (request.invalid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many codes for one of the emails (auth.otp_rate_limited)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Code delivery path unavailable (email.unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/email/change/verify:
    post:
      tags:
      - Auth
      summary: Confirm email change with both codes; other sessions are revoked
      operationId: post_api_v1_auth_email_change_verify
      description: code is from the current email, new_code from the new one; they are not interchangeable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeVerifyRequest'
      responses:
        '200':
          description: Email changed; user.email_changed published, the old email is notified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          description: A code is wrong (auth.otp_invalid) or no session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: New email was registered meanwhile (auth.email_taken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Challenge expired, used, of another session or not an email change (auth.challenge_invalid,
            auth.otp_expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Event not confirmed by the broker (events.unavailable); email unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/me:
    get:
      tags:
      - Users
      summary: Own profile
      operationId: get_api_v1_users_me
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '503':
          description: 'No profile yet and auth unavailable to create it from (auth.unavailable)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags:
      - Users
      summary: Save own profile; the first save completes onboarding
      operationId: patch_api_v1_users_me
      description: Partial update. Fields not sent stay as they are; null clears display_name and working_hours,
        and is rejected for username and timezone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '409':
          description: Username taken (user.username_taken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid username, timezone or working hours (request.invalid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/me/avatar:
    put:
      tags:
      - Users
      summary: 'Upload own avatar: the body is the image itself'
      operationId: put_api_v1_users_me_avatar
      description: PNG, JPEG or WebP up to 1 MiB; the format is checked by content and must match Content-Type. The
        frontend crops and compresses before upload. Every upload gets a new avatar_url.
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Profile with the new avatar_url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '422':
          description: Not an image of the declared type (user.avatar_invalid) or too large (user.avatar_too_large,
            details.max_bytes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: File storage unavailable (storage.unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
      - Users
      summary: Remove own avatar
      operationId: delete_api_v1_users_me_avatar
      responses:
        '204':
          description: Removed; repeating is safe
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/{user_id}/avatar:
    get:
      tags:
      - Users
      summary: Avatar image; use avatar_url from the profile
      operationId: get_api_v1_users_user_id_avatar
      description: avatar_url carries ?v=<version>, so the response is cached as immutable.
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: v
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Image
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: No avatar (user.avatar_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/username-availability:
    get:
      tags:
      - Users
      summary: Is the username free (own username counts as free)
      operationId: get_api_v1_users_username_availability
      parameters:
      - name: username
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Username'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameAvailability'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users:
    get:
      tags:
      - Users
      summary: Find people by username or email prefix, or part of the name
      operationId: get_api_v1_users
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersPage'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/lookup:
    get:
      tags:
      - Users
      summary: Profiles by a list of ids (member lists); unknown ids are skipped
      operationId: get_api_v1_users_lookup
      parameters:
      - name: ids
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersList'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/{user_id}:
    get:
      tags:
      - Users
      summary: Profile by id
      operationId: get_api_v1_users_user_id
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: No such user (user.not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/projects:
    get:
      tags:
      - Projects
      summary: List accessible projects
      operationId: get_api_v1_projects
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsPage'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
    post:
      tags:
      - Projects
      summary: Create project; any signed-in user, the caller becomes its owner
      operationId: post_api_v1_projects
      responses:
        '201':
          description: Accepted/created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectWrite'
  /api/v1/projects/{project_id}:
    get:
      tags:
      - Projects
      summary: Get project
      operationId: get_api_v1_projects_project_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
      - Projects
      summary: Update project (project.manage)
      operationId: patch_api_v1_projects_project_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
  /api/v1/projects/{project_id}/api-tokens:
    get:
      tags:
      - ApiTokens
      summary: List project API tokens, revoked included (api_token.manage)
      operationId: get_api_v1_projects_project_id_api_tokens
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokensPage'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    post:
      tags:
      - ApiTokens
      summary: Issue project API token (api_token.manage); the secret is returned only here
      description: The secret is sent by external monitoring as X-Ingest-Key. Only its SHA-256 is stored.
        The response carries Cache-Control no-store.
      operationId: post_api_v1_projects_project_id_api_tokens
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenIssued'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreate'
  /api/v1/projects/{project_id}/api-tokens/{token_id}:
    delete:
      tags:
      - ApiTokens
      summary: Revoke project API token (api_token.manage); idempotent, the token stays listed
      operationId: delete_api_v1_projects_project_id_api_tokens_token_id
      responses:
        '204':
          description: Revoked
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
