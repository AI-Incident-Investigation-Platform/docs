components:
  schemas:
    UUID:
      type: string
      format: uuid
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
      additionalProperties: false
    Problem:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
      description: Единый JSON error envelope для public/internal API; details sanitized
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
      additionalProperties: false
    AuthUser:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
    AuthSession:
      type: object
      additionalProperties: false
      required:
      - user
      - account_created
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        account_created:
          type: boolean
          description: True when this verification created the account (first sign-in).
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
        created_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - name
      - slug
      - created_at
      additionalProperties: false
    ProjectWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
      required:
      - name
      - slug
      additionalProperties: false
    Environment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        is_production:
          type: boolean
      required:
      - id
      - project_id
      - name
      - slug
      - is_production
      additionalProperties: false
    EnvironmentWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 1
          maxLength: 80
        is_production:
          type: boolean
      required:
      - name
      - slug
      additionalProperties: false
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        name:
          type: string
        external_names:
          type: array
          items:
            type: string
        description:
          type: string
        repository_url:
          type:
          - string
          - 'null'
        health_url:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
      required:
      - id
      - project_id
      - environment_id
      - name
      - external_names
      - created_at
      additionalProperties: false
    ServiceWrite:
      type: object
      properties:
        environment_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        external_names:
          type: array
          items:
            type: string
        description:
          type: string
        repository_url:
          type:
          - string
          - 'null'
        health_url:
          type:
          - string
          - 'null'
      required:
      - environment_id
      - name
      additionalProperties: false
    Deployment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        version:
          type: string
        commit_sha:
          type:
          - string
          - 'null'
        deployed_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        status:
          type: string
          enum:
          - started
          - succeeded
          - failed
          - rolled_back
        source:
          type: string
        source_url:
          type:
          - string
          - 'null'
      required:
      - id
      - project_id
      - environment_id
      - service_id
      - version
      - deployed_at
      - status
      - source
      additionalProperties: false
    Incident:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        project_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        service_ids:
          type: array
          items:
            type: string
            format: uuid
        severity:
          type: string
          enum:
          - critical
          - high
          - medium
          - low
        status:
          type: string
          enum:
          - open
          - investigating
          - awaiting_review
          - resolved
        source:
          type: string
        detected_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        created_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        updated_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
        latest_investigation_id:
          type:
          - string
          - 'null'
          format: uuid
        alert_fingerprint:
          type:
          - string
          - 'null'
      required:
      - id
      - title
      - project_id
      - environment_id
      - service_ids
      - severity
      - status
      - source
      - detected_at
