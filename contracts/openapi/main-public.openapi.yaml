            minLength: 1
            maxLength: 160
        description:
          type: string
          maxLength: 2000
        repository_url:
          type:
          - string
          - 'null'
          maxLength: 2048
          pattern: ^https?://\S+$
        health_url:
          type:
          - string
          - 'null'
          maxLength: 2048
          pattern: ^https?://\S+$
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Short-lived RS256 JWT set by /auth/otp/verify and /auth/refresh as an HttpOnly, SameSite=Strict
        cookie on Path=/. The browser never reads or sends tokens itself (credentials include). Every state-changing
        cookie-authenticated request must carry an allowlisted Origin header, otherwise 403 security.origin_forbidden.
    IngestKey:
      type: apiKey
      in: header
      name: X-Ingest-Key
      description: Project API token. Issued and revoked inside a project by members with api_token.manage; bound to
        the project (and optionally environment), shown once, stored only as a hash.
    ServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: service JWT or opaque token
  parameters: {}
