openapi: 3.1.0
info:
  title: AI Incident Investigator — Main Backend Public API
  version: 1.0.0-proposed
  description: Implementation baseline v3 (PROPOSED pending team approval). Public REST only. No AI callbacks exposed
    on public spec. Passwordless email OTP, cookie-only session, permissions inside a project.
servers:
- url: /
  description: same-origin public API behind Traefik
security:
- CookieAuth: []
tags:
- name: Auth
- name: Projects
- name: Environments
- name: Services
- name: Deployments
- name: Incidents
- name: Investigations
- name: AI output
- name: Dashboard
- name: Telemetry
- name: Integrations
- name: Settings
- name: Ingestion
- name: Internal callbacks
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Start sign-in or sign-up by email and send a one-time code (NO session)
      operationId: post_api_v1_auth_login
      description: One entry point for both sign-in and sign-up; there are no passwords. The response is the same
        whether the email is registered or not. The account is created only by a successful /auth/otp/verify, so
        unconfirmed accounts do not exist. Cookies are never set here.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '202':
          description: Code delivery queued; no session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginChallenge'
        '403':
          description: Origin not allowed (origin_forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid email (validation_error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many codes requested for this email or client (otp_rate_limited)
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Code delivery path unavailable (otp_delivery_unavailable); nothing was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/otp/verify:
    post:
      tags:
      - Auth
      operationId: verifyEmailOtp
      summary: Verify the one-time code, create the account if new, and open a session
      description: The only endpoint that opens a session. Verification is atomic and one-time, bound to the
        challenge from /auth/login. For an unknown email the account is created here (account_created=true).
        Tokens are never returned in the body; both are set as HttpOnly cookies.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Session opened
          headers:
            Set-Cookie:
              description: 'access_token: HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=900 and refresh_token:
                HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=2592000'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: Wrong code (otp_invalid); details.attempts_left is the number of attempts left
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Origin not allowed (origin_forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Code expired, already used or attempts exhausted (otp_expired, otp_challenge_invalid); start
            again with /auth/login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many attempts (otp_rate_limited)
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/otp/resend:
    post:
      tags:
      - Auth
      operationId: resendEmailOtp
      summary: Send a new code for an existing challenge
      description: The previous code becomes invalid. Not more often than resend_after and not more than 3 times per
        challenge; the challenge lives at most 900 seconds.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
      responses:
        '202':
          description: Replacement code queued; previous code revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpResendResponse'
        '410':
          description: Challenge no longer valid (otp_challenge_invalid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Resend too early or resend limit reached (otp_rate_limited)
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Rotate the session cookies
      operationId: post_api_v1_auth_refresh
      description: Reads the refresh_token cookie, rotates it and issues a new access_token cookie. No body in either
        direction. A code is not required again for an already verified session.
      security: []
      responses:
        '204':
          description: Cookies rotated
          headers:
            Set-Cookie:
              description: New access_token and refresh_token cookies, same attributes as in /auth/otp/verify
              schema:
                type: string
        '401':
          description: Refresh cookie missing, expired, revoked or reused (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Origin not allowed (origin_forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke the current session
      operationId: post_api_v1_auth_logout
      description: Revokes the session of the refresh_token cookie and clears both cookies. Idempotent.
      security: []
      responses:
        '204':
          description: Session revoked, cookies cleared
        '403':
          description: Origin not allowed (origin_forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Current user identity
      operationId: get_api_v1_auth_me
      description: Identity only. Projects and the caller's permissions in them come from the projects API.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          description: Not authenticated (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/projects:
    get:
      tags:
      - Projects
      summary: List accessible projects
      operationId: get_api_v1_projects
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsPage'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
    post:
      tags:
      - Projects
      summary: Create project; any signed-in user, the caller becomes its owner
      operationId: post_api_v1_projects
      responses:
        '201':
          description: Accepted/created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectWrite'
  /api/v1/projects/{project_id}:
    get:
      tags:
      - Projects
      summary: Get project
      operationId: get_api_v1_projects_project_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
      - Projects
      summary: Update project (project.manage)
      operationId: patch_api_v1_projects_project_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectWrite'
  /api/v1/projects/{project_id}/environments:
