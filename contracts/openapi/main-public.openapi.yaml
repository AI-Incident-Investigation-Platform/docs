          minimum: 1
          maximum: 300
        resend_after:
          type: integer
          minimum: 0
          maximum: 3600
    Username:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9-]{1,30}[A-Za-z0-9]$
      description: 3–32 latin letters, digits and '-', not at the edges; stored and compared lowercase.
    WorkingHours:
