      properties:
        challenge_id:
          type: string
          pattern: ^ch_[A-Za-z0-9_-]{20,120}$
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: Code from the current email
        new_code:
          type: string
          pattern: ^[0-9]{6}$
          description: Code from the new email
    EmailChangeChallenge:
      type: object
      additionalProperties: false
      required:
