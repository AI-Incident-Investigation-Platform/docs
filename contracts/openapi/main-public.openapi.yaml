components:
  schemas:
    UUID:
      type: string
      format: uuid
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
      additionalProperties: false
    Problem:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
      description: Единый JSON error envelope для public/internal API; details sanitized
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
      additionalProperties: false
    AuthUser:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
    AuthSession:
      type: object
      additionalProperties: false
      required:
      - user
      - account_created
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        account_created:
          type: boolean
          description: True when this verification created the account (first sign-in).
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
        created_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - name
      - slug
      - created_at
      additionalProperties: false
    TokenScope:
      type: string
      enum:
      - alert.ingest
      - deployment.ingest
    ApiToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment_id:
          type:
          - string
          - 'null'
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: Start of the secret to recognise it in the list; the secret cannot be restored from it
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/TokenScope'
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - project_id
      - environment_id
      - name
      - prefix
      - scopes
      - created_by
      - created_at
      - expires_at
      - last_used_at
      - revoked_at
      additionalProperties: false
    ApiTokenCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        environment_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Bind the token to one environment of the project
        scopes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TokenScope'
          description: Defaults to all scopes
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Must be in the future; null — no expiry
      required:
      - name
      additionalProperties: false
    ApiTokenIssued:
      type: object
      properties:
        token:
          $ref: '#/components/schemas/ApiToken'
        secret:
          type: string
          description: Shown once; aiip_ followed by 43 url-safe characters
      required:
      - token
      - secret
      additionalProperties: false
    ApiTokensPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    ProjectWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          minLength: 2
          maxLength: 80
          pattern: ^[a-z0-9][a-z0-9-]*$
        description:
          type: string
          maxLength: 2000
      required:
      - name
      - slug
      additionalProperties: false
    Environment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        is_production:
          type: boolean
      required:
      - id
      - project_id
      - name
      - slug
      - is_production
      additionalProperties: false
    EnvironmentWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[a-z0-9][a-z0-9-]*$
        is_production:
          type: boolean
          default: false
      required:
      - name
      - slug
      additionalProperties: false
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        name:
          type: string
        external_names:
          type: array
          items:
            type: string
        description:
          type: string
        repository_url:
          type:
          - string
          - 'null'
        health_url:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
          description: UTC, RFC3339 timestamp
      required:
      - id
      - project_id
      - environment_id
      - name
      - external_names
      - created_at
      additionalProperties: false
    ServiceWrite:
      type: object
      properties:
        environment_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        external_names:
          type: array
          items:
            type: string
        description:
          type: string
        repository_url:
          type:
          - string
          - 'null'
        health_url:
          type:
          - string
          - 'null'
      required:
      - environment_id
      - name
      additionalProperties: false
    Deployment:
      type: object
      properties:
        id:
